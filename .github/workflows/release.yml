name: Release Window

on:
  push:
    tags:
      - 'window-v*'

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pre-signing:
    name: Pre-signing release gate
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: psewdon1m-exocortex/general
          ref: 65b2f5461a4499243024f4125fb7d4db3df89ad6
          path: .central-docs
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Require exact release tag at current main and no existing release
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^window-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF_NAME" != window-v0.0.0 ]]
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$main_sha" && "$main_sha" == "$GITHUB_SHA" ]]
          status="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          [[ "$status" == 404 ]] || { echo "Release tag is already published or GitHub returned HTTP $status" >&2; exit 1; }
      - name: Fetch exact checksummed Updater dependency
        run: bash scripts/fetch-updater.sh "$RUNNER_TEMP/pinned-updater"
      - name: Build and smoke-test an unsigned candidate with a temporary key
        shell: bash
        run: |
          umask 077
          candidate_key="$(mktemp "$RUNNER_TEMP/window-candidate.XXXXXX.pem")"
          trap 'rm -f "$candidate_key"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$candidate_key" 2>/dev/null
          export WINDOW_RELEASE_SIGNING_KEY_FILE="$candidate_key"
          export WINDOW_UPDATER_BOOTSTRAP_FILE="$RUNNER_TEMP/pinned-updater/updater-bootstrap.sh"
          export WINDOW_MIN_UPDATER_VERSION=0.6.11
          bash scripts/build-release.sh "${GITHUB_REF_NAME#window-v}" candidate-artifacts
          (cd candidate-artifacts && sha256sum window-linux-amd64 window-linux-arm64 window.service updater-bootstrap.sh) > candidate.sha256
      - name: Evaluate Part 12 before release credentials are available
        shell: bash
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          python3 scripts/release-gate.py pre \
            --docs .central-docs \
            --main-revision "$main_sha" \
            --updater-dir "$RUNNER_TEMP/pinned-updater" \
            --artifacts candidate-artifacts \
            --report pre-release-gate.json
      - name: Preserve immutable candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: window-candidate-${{ github.sha }}
          path: |
            candidate.sha256
            pre-release-gate.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Sign, verify and publish
    needs: pre-signing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: psewdon1m-exocortex/general
          ref: 65b2f5461a4499243024f4125fb7d4db3df89ad6
          path: .central-docs
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: window-candidate-${{ github.sha }}
      - name: Recheck main and pinned dependency
        shell: bash
        run: |
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
          bash scripts/fetch-updater.sh "$RUNNER_TEMP/pinned-updater"
      - name: Sign exact release and compare candidate bytes
        env:
          WINDOW_RELEASE_SIGNING_KEY: ${{ secrets.WINDOW_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          [[ -n "$WINDOW_RELEASE_SIGNING_KEY" ]] || { echo 'Protected Window signing key is missing' >&2; exit 1; }
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/window-signing.XXXXXX.pem")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$WINDOW_RELEASE_SIGNING_KEY" > "$key_file"
          export WINDOW_RELEASE_SIGNING_KEY_FILE="$key_file"
          export WINDOW_UPDATER_BOOTSTRAP_FILE="$RUNNER_TEMP/pinned-updater/updater-bootstrap.sh"
          export WINDOW_MIN_UPDATER_VERSION=0.6.11
          bash scripts/build-release.sh "${GITHUB_REF_NAME#window-v}" release-artifacts
          (cd release-artifacts && sha256sum --check ../candidate.sha256)
          (cd release-artifacts && sha256sum window-linux-amd64 window-linux-arm64 window.service \
            updater-bootstrap.sh window-release-linux-amd64.json window-release-linux-amd64.json.sig.json \
            window-release-linux-arm64.json window-release-linux-arm64.json.sig.json \
            window.pem window-bootstrap.sh) > release-artifacts/checksums.txt
      - name: Verify signature, manifests, bootstrap and exact candidate
        run: >-
          python3 scripts/release-gate.py verify
          --docs .central-docs
          --artifacts release-artifacts
          --candidate-hashes candidate.sha256
          --pre-report pre-release-gate.json
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release-artifacts/*'
      - name: Create draft release with tested assets
        id: create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag --draft --latest=false --generate-notes \
            --title "Window ${GITHUB_REF_NAME#window-v}"
      - name: Download and compare draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/draft-assets"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/draft-assets"
          for asset in release-artifacts/*; do
            cmp "$asset" "$RUNNER_TEMP/draft-assets/${asset##*/}"
          done
      - name: Publish the immutable version, never latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
      - name: Anonymous release download smoke
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/public-assets"
          for asset in release-artifacts/*; do
            name="${asset##*/}"
            curl -fLSs --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 180 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" \
              -o "$RUNNER_TEMP/public-assets/$name"
          done
      - name: Complete Part 12 report against public bytes
        shell: bash
        run: >-
          python3 scripts/release-gate.py final
          --docs .central-docs
          --artifacts release-artifacts
          --candidate-hashes candidate.sha256
          --pre-report pre-release-gate.json
          --published-dir "$RUNNER_TEMP/public-assets"
          --report known-problems-report.json
      - name: Attach and check the final report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" known-problems-report.json
          curl -fLSs --proto '=https' --proto-redir '=https' --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/known-problems-report.json" \
            -o "$RUNNER_TEMP/public-report.json"
          cmp known-problems-report.json "$RUNNER_TEMP/public-report.json"
      - name: Retract an incomplete release
        if: ${{ failure() && steps.create_draft.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=true --latest=false
